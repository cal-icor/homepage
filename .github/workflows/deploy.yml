name: Build & Deploy Hugo Site

on:
  push:
    branches: [main, ben]
  pull_request:
    branches: [main, ben]
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * *' # nightly, to refresh the homepage usage map

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.155.2'
          extended: true

      # Writes data/hub_stats.json for the usage map. If it fails, the site
      # still deploys and the map section is left out.
      - name: Fetch hub usage
        continue-on-error: true
        env:
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: python3 scripts/fetch_hub_stats.py

      - name: Build site
        run: hugo --minify --logLevel error

      - name: Copy CNAME file
        run: |
          if [ -f CNAME ]; then cp CNAME public/CNAME; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
