<header class="navbar">
  <div class="container navbar-container">
    <a href="/" class="navbar-brand">
      <img src="/images/logos/cal-icor-mark.png" alt="" class="navbar-logo navbar-logo-light">
      <img src="/images/logos/cal-icor-mark-dark.png" alt="" class="navbar-logo navbar-logo-dark">
      <span class="navbar-title">Cal-ICOR</span>
    </a>
    
    <div class="navbar-right">
      <button class="navbar-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span class="navbar-toggle-icon"></span>
      </button>
      <nav class="navbar-nav">
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}">
          {{ .Name }}
        </a>
        {{ end }}
      </nav>
      <button type="button" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
        <span class="theme-toggle-icons" aria-hidden="true">
          <svg class="theme-toggle-icon theme-toggle-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>
          </svg>
          <svg class="theme-toggle-icon theme-toggle-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
          </svg>
        </span>
      </button>
    </div>
  </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var toggle = document.querySelector('.navbar-toggle');
  var nav = document.querySelector('.navbar-nav');
  toggle.addEventListener('click', function() {
    var expanded = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', !expanded);
    nav.classList.toggle('open');
  });

  var themeBtn = document.querySelector('.theme-toggle');
  function setThemeLabel() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeBtn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
    themeBtn.setAttribute('title', isDark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  setThemeLabel();
  themeBtn.addEventListener('click', function() {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    setThemeLabel();
  });
});
</script>
